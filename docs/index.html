<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIRP QA Dashboard — OmniSense Platform</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:#0d1117;color:#c9d1d9;line-height:1.5}
code,pre,.mono{font-family:'IBM Plex Mono',monospace}

/* ── SIRP Top Bar ─── */
.topbar{background:#161b22;border-bottom:1px solid #21262d;padding:12px 32px;display:flex;justify-content:space-between;align-items:center}
.topbar-left{display:flex;align-items:center;gap:16px}
.sirp-logo{font-family:'DM Sans',sans-serif;font-size:20px;font-weight:700;color:#fff;letter-spacing:1px}
.sirp-logo span{color:#8e2dff}
.org-badge{font-size:11px;color:#8b949e;background:#21262d;padding:5px 14px;border-radius:6px;border:1px solid #30363d}
.nav-pills{display:flex;gap:6px}
.nav-pill{padding:6px 16px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:none;color:#8b949e;background:transparent;transition:all .15s}
.nav-pill:hover{color:#c9d1d9;background:#21262d}
.nav-pill.active{background:#8e2dff;color:#fff}

/* ── Header ─── */
.header{background:linear-gradient(135deg,#0d1117 0%,#161b22 50%,#1a1040 100%);padding:32px 32px 28px;border-bottom:1px solid #21262d}
.header h1{font-size:22px;font-weight:700;color:#fff;margin-bottom:2px}
.header .sub{color:#8b949e;font-size:13px;margin-bottom:12px}
.meta-row{display:flex;gap:20px;font-size:12px;color:#484f58;flex-wrap:wrap}
.meta-row span{color:#8b949e;font-weight:500}

.content{padding:24px 32px;max-width:1400px;margin:0 auto}

/* ── Metrics ─── */
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:24px}
.m{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:16px;text-align:center}
.mv{font-size:28px;font-weight:700;font-family:'IBM Plex Mono',monospace;margin-bottom:2px}
.ml{font-size:10px;color:#484f58;text-transform:uppercase;letter-spacing:1.5px;font-weight:600}

/* ── Live Banner ─── */
.live-banner{border:1px solid #21262d;border-radius:8px;padding:12px 20px;margin-bottom:20px;display:none;align-items:center;gap:12px}
.live-banner.running{background:rgba(210,153,34,.06);border-color:rgba(210,153,34,.3)}
.live-banner.completed{background:rgba(63,185,80,.06);border-color:rgba(63,185,80,.3)}
.live-dot{width:8px;height:8px;border-radius:50%;animation:pulse 1.5s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
.live-text{font-size:13px;font-weight:600}
.live-detail{font-size:12px;color:#8b949e}

/* ── Suite Cards ─── */
.suites{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.suite{background:#161b22;border:1px solid #21262d;border-radius:8px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.suite:hover{border-color:#8e2dff}
.sh{padding:14px 18px;border-bottom:1px solid #21262d;display:flex;justify-content:space-between;align-items:center}
.sn{font-size:14px;font-weight:600;color:#e6edf3;display:flex;align-items:center;gap:8px}
.sn .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.badge{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.sc{padding:14px 18px}
.stats{display:flex;gap:18px;font-size:12px;color:#8b949e;margin-bottom:8px}
.stats b{font-weight:600}
.bar{height:4px;background:#21262d;border-radius:2px;overflow:hidden;margin-bottom:6px}
.bar-fill{height:4px;border-radius:2px;transition:width .4s}
.stime{font-size:11px;color:#484f58}

/* ── Tabs ─── */
.tabs{display:flex;gap:4px;margin-bottom:20px}
.tab{padding:7px 18px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:none;color:#8b949e;background:#161b22;border:1px solid #21262d;transition:all .15s}
.tab:hover{color:#c9d1d9;border-color:#30363d}
.tab.active{background:#8e2dff;color:#fff;border-color:#8e2dff}

/* ── Cards & Tables ─── */
.card{background:#161b22;border:1px solid #21262d;border-radius:8px;overflow:hidden;margin-bottom:20px}
.ch{padding:12px 18px;border-bottom:1px solid #21262d;display:flex;justify-content:space-between;align-items:center}
.ch-title{font-size:13px;font-weight:600;color:#e6edf3}
.ch-meta{font-size:11px;color:#484f58}

table{width:100%;border-collapse:collapse}
th{padding:8px 16px;text-align:left;font-size:10px;color:#484f58;text-transform:uppercase;letter-spacing:1.5px;font-weight:600;background:#0d1117;border-bottom:1px solid #21262d}
td{padding:10px 16px;border-bottom:1px solid #161b22;font-size:13px;color:#c9d1d9}
tr:hover{background:rgba(142,45,255,.03)}

.st{display:inline-block;padding:2px 10px;border-radius:12px;font-size:10px;font-weight:600;font-family:'IBM Plex Mono',monospace;text-transform:uppercase}
.st-pass{background:rgba(63,185,80,.12);color:#3fb950}
.st-fail{background:rgba(248,81,73,.12);color:#f85149}
.tdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;vertical-align:middle}
.detail-col{color:#8b949e;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time-col{color:#484f58;font-family:'IBM Plex Mono',monospace;font-size:11px;text-align:right}

/* ── Screenshot Links ─── */
.ss-link{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .15s;font-family:'IBM Plex Mono',monospace}
.ss-pass{color:#3fb950;background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.2)}
.ss-pass:hover{background:rgba(63,185,80,.2)}
.ss-fail{color:#f85149;background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.2)}
.ss-fail:hover{background:rgba(248,81,73,.2)}
.ss-none{font-size:11px;color:#30363d}

/* ── Screenshot Modal ─── */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:1000;align-items:center;justify-content:center;cursor:pointer}
.modal-overlay.show{display:flex}
.modal-overlay img{max-width:92%;max-height:92%;border-radius:8px;border:1px solid #30363d}
.modal-close{position:fixed;top:16px;right:20px;color:#c9d1d9;font-size:24px;cursor:pointer;z-index:1001;background:#21262d;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid #30363d}

.empty{padding:48px;text-align:center;color:#484f58;font-size:13px}
.footer{padding:16px 32px;text-align:center;color:#30363d;font-size:11px;border-top:1px solid #161b22;margin-top:12px}

@media(max-width:900px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  .suites{grid-template-columns:1fr}
  .content,.topbar,.header{padding-left:16px;padding-right:16px}
}
</style>
</head>

<script>
let DATA = null;
let activeTab = "all";
let isRunning = false;

const SUITE_LABELS = {
  incident_management: { name: "Incident Management", short: "IM", color: "#8e2dff" },
  autonomy_automation: { name: "Autonomy Automation", short: "AUTO", color: "#58a6ff" },
  entities:            { name: "Entities", short: "ENT", color: "#3fb950" },
  sara_ai_evaluation:  { name: "SARA AI Evaluation",  short: "SARA", color: "#bc8cff" }
};

const SCREENSHOT_BASE = "https://raw.githubusercontent.com/SAIFA-ASGHAR/sirp-qa-automation/main/reports/screenshots/";

const STEP_TO_TEST = {
  "TC01":"test_01_navigate_to_im","TC02":"test_02_verify_grid_tabs","TC03":"test_03_create_ticket",
  "TC04":"test_04_open_ticket_detail","TC05":"test_05_general_tab","TC06":"test_06_omnisense_assist_mode",
  "TC07":"test_07_run_enrichment_agent","TC08":"test_08_run_classification_agent","TC09":"test_09_autonomous_mode",
  "TC10":"test_10_artifacts_tab","TC11":"test_11_add_artifact","TC12":"test_12_add_comment",
  "TC13":"test_13_tasks_tab","TC14":"test_14_affected_entities_tab","TC15":"test_15_remediation_tab",
  "TC16":"test_16_omnimap_tab","TC17":"test_17_logs_tab","TC18":"test_18_context_panel",
};

let SCREENSHOT_INDEX = {};

function rc(r){ return r >= 90 ? "#3fb950" : r >= 70 ? "#d29922" : "#f85149"; }
function rbg(r){ return r >= 90 ? "rgba(63,185,80,.12)" : r >= 70 ? "rgba(210,153,34,.12)" : "rgba(248,81,73,.12)"; }

function timeAgo(ts){
  if(!ts) return "";
  const d = Date.now() - new Date(ts).getTime();
  const m = Math.floor(d/60000);
  if(m < 1) return "just now";
  if(m < 60) return m + "m ago";
  const h = Math.floor(m/60);
  if(h < 24) return h + "h ago";
  return Math.floor(h/24) + "d ago";
}

function openScreenshot(url){ document.getElementById("ss-modal-img").src=url; document.getElementById("ss-modal").classList.add("show"); }
function closeScreenshot(){ document.getElementById("ss-modal").classList.remove("show"); document.getElementById("ss-modal-img").src=""; }
document.addEventListener("keydown", e => { if(e.key==="Escape") closeScreenshot(); });

function findScreenshot(step, status){
  const tcMatch = step.match(/TC(\d+)/);
  if(tcMatch){
    const tcKey = "TC" + tcMatch[1].padStart(2,"0");
    const testName = STEP_TO_TEST[tcKey];
    if(testName){
      const key = status + "_" + testName;
      if(SCREENSHOT_INDEX[key]) return SCREENSHOT_BASE + SCREENSHOT_INDEX[key];
    }
  }
  return null;
}

function screenshotCell(step, status, runId, screenshotFile){
  if(screenshotFile){
    const url = SCREENSHOT_BASE + screenshotFile;
    const cls = status === "FAIL" ? "ss-fail" : "ss-pass";
    const label = status === "FAIL" ? "Failure" : "View";
    return `<a class="ss-link ${cls}" href="${url}" target="_blank" onclick="event.preventDefault();openScreenshot('${url}')">📸 ${label}</a>`;
  }
  const indexed = findScreenshot(step, status);
  if(indexed){
    const cls = status === "FAIL" ? "ss-fail" : "ss-pass";
    const label = status === "FAIL" ? "Failure" : "View";
    return `<a class="ss-link ${cls}" href="${indexed}" target="_blank" onclick="event.preventDefault();openScreenshot('${indexed}')">📸 ${label}</a>`;
  }
  return `<span class="ss-none">—</span>`;
}

function render(){
  if(!DATA || !DATA.suites) return;
  const suiteKeys = Object.keys(DATA.suites);

  const totalTC = suiteKeys.reduce((a,k) => a + (DATA.suites[k].last_total||0), 0);
  const totalP  = suiteKeys.reduce((a,k) => a + (DATA.suites[k].last_passed||0), 0);
  const totalF  = suiteKeys.reduce((a,k) => a + (DATA.suites[k].last_failed||0), 0);
  const rate    = totalTC > 0 ? Math.round(totalP/totalTC*100) : 0;
  const runs    = (DATA.runs||[]).length;

  document.getElementById("metrics-area").innerHTML = [
    ["Total tests", totalTC, "#e6edf3"],
    ["Pass rate", rate + "%", rc(rate)],
    ["Passed", totalP, "#3fb950"],
    ["Failed", totalF, totalF > 0 ? "#f85149" : "#3fb950"],
    ["Total runs", runs, "#8e2dff"],
  ].map(([l,v,c]) => `<div class="m"><div class="mv" style="color:${c}">${v}</div><div class="ml">${l}</div></div>`).join("");

  let shtml = "";
  for(const k of suiteKeys){
    const s = DATA.suites[k];
    const meta = SUITE_LABELS[k] || { name: k, short: k, color: "#8e2dff" };
    const r = s.last_rate || 0;
    const c = rc(r);
    shtml += `<div class="suite" onclick="activeTab='${k}';render();">
      <div class="sh">
        <div class="sn"><span class="dot" style="background:${c}"></span>${meta.name}</div>
        <span class="badge" style="background:${rbg(r)};color:${c}">${r}%</span>
      </div>
      <div class="sc">
        <div class="stats">
          <span><b style="color:#3fb950">${s.last_passed||0}</b> passed</span>
          <span><b style="color:${(s.last_failed||0)>0?"#f85149":"#3fb950"}">${s.last_failed||0}</b> failed</span>
          <span>${s.last_total||0} total</span>
        </div>
        <div class="bar"><div class="bar-fill" style="width:${r}%;background:${c}"></div></div>
        <div class="stime">${s.last_run ? "Last run: " + timeAgo(s.last_run) : "No runs yet"}</div>
      </div>
    </div>`;
  }
  document.getElementById("suites-area").innerHTML = shtml;

  let tabsHtml = `<button class="tab${activeTab==="all"?" active":""}" onclick="activeTab='all';render();">All runs</button>`;
  tabsHtml += suiteKeys.map(k => {
    const meta = SUITE_LABELS[k] || { short: k };
    return `<button class="tab${activeTab===k?" active":""}" onclick="activeTab='${k}';render();">${meta.name}</button>`;
  }).join("");
  document.getElementById("tabs-area").innerHTML = tabsHtml;

  if(activeTab === "all") renderAllRuns(); else renderSuiteDetail(activeTab);

  const latest = (DATA.runs||[])[(DATA.runs||[]).length - 1];
  if(latest) document.getElementById("last-run-meta").innerHTML = `Last updated: <span>${latest.date} ${latest.time}</span>`;
  checkLiveRun();
}

function renderSuiteDetail(suiteKey){
  const runs = (DATA.runs||[]).filter(r => r.suite === suiteKey).slice().reverse();
  const area = document.getElementById("table-area");
  if(!runs.length){ area.innerHTML = `<div class="empty">No test runs recorded for this suite yet.</div>`; return; }

  let html = "";
  for(const run of runs){
    const c = rc(run.pass_rate);
    const actor = run.triggered_by ? ` <span style="font-size:11px;color:#8b949e;font-weight:400;margin-left:8px">by ${run.triggered_by}</span>` : "";
    html += `<div class="card">
      <div class="ch">
        <div class="ch-title">Run: ${run.date} ${run.time}${actor}</div>
        <div class="ch-meta">
          <span style="color:#3fb950;font-weight:600">${run.passed} passed</span> &nbsp;
          ${run.failed > 0 ? `<span style="color:#f85149;font-weight:600">${run.failed} failed</span> &nbsp;` : ""}
          <span class="badge" style="background:${rbg(run.pass_rate)};color:${c}">${run.pass_rate}%</span>
          &nbsp; <span style="color:#484f58">${Math.round(run.duration_s)}s</span>
        </div>
      </div>
      <table>
        <thead><tr>
          <th style="width:36px">#</th><th>Test case</th><th style="width:72px;text-align:center">Status</th>
          <th>Detail</th><th style="width:90px;text-align:center">Evidence</th><th style="width:66px;text-align:right">Time</th>
        </tr></thead>
        <tbody>${run.results.map((r,i) => `<tr>
          <td style="color:#484f58;text-align:center;font-size:12px;font-family:'IBM Plex Mono',monospace">${i+1}</td>
          <td><span class="tdot" style="background:${r.status==="PASS"?"#3fb950":"#f85149"}"></span>${r.step}</td>
          <td style="text-align:center"><span class="st ${r.status==="PASS"?"st-pass":"st-fail"}">${r.status}</span></td>
          <td class="detail-col">${r.detail||""}</td>
          <td style="text-align:center">${screenshotCell(r.step, r.status, run.run_id, r.screenshot||"")}</td>
          <td class="time-col">${r.time||""}</td>
        </tr>`).join("")}</tbody>
      </table>
    </div>`;
  }
  area.innerHTML = html;
}

function renderAllRuns(){
  const runs = (DATA.runs||[]).slice().reverse();
  const area = document.getElementById("table-area");
  if(!runs.length){ area.innerHTML = `<div class="empty">No runs yet.</div>`; return; }

  let rows = runs.map(r => {
    const meta = SUITE_LABELS[r.suite] || { name: r.suite };
    const c = rc(r.pass_rate);
    const actor = r.triggered_by || "—";
    const event = r.trigger_event === "push" ? "🔄" : r.trigger_event === "workflow_dispatch" ? "▶️" : "";
    return `<tr style="cursor:pointer" onclick="activeTab='${r.suite}';render();">
      <td><span style="color:${SUITE_LABELS[r.suite]?.color||"#8e2dff"};font-weight:600">${meta.name}</span></td>
      <td>${r.date}</td>
      <td class="mono" style="color:#8b949e">${r.time}</td>
      <td style="color:#8b949e;font-size:12px">${event} ${actor}</td>
      <td style="color:#3fb950;font-weight:600">${r.passed}</td>
      <td style="color:${r.failed>0?"#f85149":"#3fb950"};font-weight:600">${r.failed}</td>
      <td><span class="badge" style="background:${rbg(r.pass_rate)};color:${c}">${r.pass_rate}%</span></td>
      <td class="time-col">${Math.round(r.duration_s)}s</td>
    </tr>`;
  }).join("");

  area.innerHTML = `<div class="card">
    <div class="ch"><div class="ch-title">All test runs</div><div class="ch-meta">${runs.length} runs total</div></div>
    <table>
      <thead><tr><th>Suite</th><th>Date</th><th>Time</th><th>Triggered by</th><th>Passed</th><th>Failed</th><th>Rate</th><th style="text-align:right">Duration</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

async function checkLiveRun(){
  const banner = document.getElementById("live-banner");
  const detail = document.getElementById("live-detail");
  const title = document.getElementById("live-title");
  const dot = document.getElementById("live-dot");

  try {
    const resp = await fetch("https://api.github.com/repos/SAIFA-ASGHAR/sirp-qa-automation/actions/runs?status=in_progress&per_page=1");
    if(resp.ok){
      const data = await resp.json();
      if(data.workflow_runs && data.workflow_runs.length > 0){
        const run = data.workflow_runs[0];
        banner.style.display = "flex";
        banner.className = "live-banner running";
        title.textContent = "Tests running...";
        title.style.color = "#d29922";
        dot.style.background = "#d29922";
        const actor = run.actor?.login || "unknown";
        detail.textContent = `Triggered by ${actor} — started ${timeAgo(run.created_at)}`;
        isRunning = true;
        return;
      }
    }
  } catch(e){}

  isRunning = false;
  if(!DATA || !DATA.runs || !DATA.runs.length){ banner.style.display = "none"; return; }

  const latest = DATA.runs[DATA.runs.length - 1];
  const age = Date.now() - new Date(latest.timestamp).getTime();
  const fiveMin = 5 * 60 * 1000;

  if(age < fiveMin){
    banner.style.display = "flex";
    banner.className = "live-banner completed";
    const suite = SUITE_LABELS[latest.suite]?.name || latest.suite;
    const rateColor = rc(latest.pass_rate);
    title.textContent = "Run completed";
    title.style.color = rateColor;
    dot.style.background = rateColor;
    const actor = latest.triggered_by ? ` by ${latest.triggered_by}` : "";
    detail.textContent = `${suite} — ${latest.passed}/${latest.total} passed (${latest.pass_rate}%)${actor} — ${timeAgo(latest.timestamp)}`;
  } else {
    banner.style.display = "none";
  }
}

function startAutoRefresh(){
  setInterval(() => { checkLiveRun(); }, 15000);
  setInterval(async () => {
    try {
      const resp = await fetch("data.json?" + Date.now());
      if(!resp.ok) return;
      const newData = await resp.json();
      if(JSON.stringify(newData) !== JSON.stringify(DATA)){ DATA = newData; render(); }
    } catch(e){}
  }, 30000);
}

async function loadScreenshotIndex(){
  try{
    const resp = await fetch("https://api.github.com/repos/SAIFA-ASGHAR/sirp-qa-automation/contents/reports/screenshots");
    if(!resp.ok) return;
    const files = await resp.json();
    for(const f of files){
      if(!f.name.endsWith(".png")) continue;
      const m = f.name.match(/^(PASS|FAIL)_(test_.+?)_\d{6}\.png$/);
      if(m) SCREENSHOT_INDEX[m[1] + "_" + m[2]] = f.name;
    }
  } catch(e){}
}

fetch("data.json?" + Date.now())
  .then(r => { if(!r.ok) throw new Error(); return r.json(); })
  .then(async d => { DATA = d; await loadScreenshotIndex(); render(); startAutoRefresh(); })
  .catch(() => {
    document.getElementById("table-area").innerHTML =
      `<div class="empty"><p style="font-size:16px;margin-bottom:8px">No test data yet</p><p>Run your test suites and the dashboard will update automatically.</p></div>`;
  });
</script>
